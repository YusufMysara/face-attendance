name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: attendance
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: attendance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U attendance -d attendance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # The same settings the app and the tests read (see app/config.py and .env.example).
    env:
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: attendance
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"  # matches the Dockerfile
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations
        run: alembic upgrade head

      # The tests build their own attendance_test database from the same migrations.
      - name: Run tests
        run: python -m pytest
